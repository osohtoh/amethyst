
[dependency-groups]
dev = [
    "black<25.0.0,>=24.4.2",
    "ruff<1.0.0,>=0.4.4",
    "autopep8<3.0.0,>=2.1.0",
    "pytest<9.0.0,>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amethyst"]

[project]
authors = [
    {name = "Bernard Kamiński"},
]
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.9"
dependencies = [
    "rdkit>=2023.9.6",
    "click<9.0.0,>=8.1.7",
]
name = "amethyst-rdkit"
version = "1.1"
description = "An analogue generator."
readme = "README.md"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
keywords = [
    "chemistry",
    "analogues",
    "combinatorial chemistry",
    "rdkit",
    "cheminformatics"
]

[project.urls]
repository = "https://github.com/osohtoh/amethyst"
